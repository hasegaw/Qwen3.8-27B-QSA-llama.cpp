; copy to /etc/supervisor/conf.d/qwen38.conf, then: supervisorctl reread && supervisorctl update
[program:qwen38]
environment=PROC_NAME="%(program_name)s"
command=/opt/supervisor-scripts/qwen38.sh
autostart=true
autorestart=unexpected
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
redirect_stderr=true
stdout_logfile_maxbytes=0
